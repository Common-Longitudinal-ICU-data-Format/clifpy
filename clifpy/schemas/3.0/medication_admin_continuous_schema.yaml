      - not_administered
      - other

required_columns:
  - hospitalization_id
  - admin_dttm
  - med_category
  - med_group
  - med_route_category
  - med_dose
  - med_dose_unit
  - mar_action_category
  - mar_action_group

category_columns:
  - med_category
  - med_route_category
  - mar_action_category

group_columns:
  - med_group
  - mar_action_group

# Regenerated from mCIDE clif_medication_admin_continuous_med_categories.csv.
# Values may be a single group name or a list of permissible groups —
# the C.6 validator accepts either form (see check_category_group_mapping_*).
# Upstream currently assigns exactly one group per med.
