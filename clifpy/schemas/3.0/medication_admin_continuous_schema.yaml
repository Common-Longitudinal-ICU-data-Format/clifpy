# Expected dose unit(s) per med_category (from mCIDE med_categories CSV).
# Units are upstream's reference units, verbatim. The C.8 check compares the
# NUMERATOR only (observed mcg/min matches expected mcg/kg/min; mg/min does
# not), and when the expected unit is a rate the observed unit must be a rate
# too. Scalar = single accepted unit; list = any of them.
