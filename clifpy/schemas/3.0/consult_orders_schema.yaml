table_name: consult_orders
version: "3.0"

columns:
  - name: hospitalization_id
    data_type: VARCHAR
    required: true
    is_category_column: false
    is_group_column: false
  - name: order_dttm
    data_type: DATETIME
    required: true
    is_category_column: false
    is_group_column: false
  - name: order_name
    data_type: VARCHAR
    required: false
    is_category_column: false
    is_group_column: false
  - name: order_category
    data_type: VARCHAR
    required: true
    is_category_column: true
    is_group_column: false
    permissible_values:
      - pt
      - ot
      - speech
      - swallowing
      - nutrition
      - respiratory
      - social_work
      - skin_care
      - ostomy_care
      - pain_services
      - addiction_sud
      - psychiatry
      - pastoral_services
      - palliative_care
      - interpreter
  - name: order_status_name
    data_type: VARCHAR
    required: false
    is_category_column: false
    is_group_column: false
  - name: order_status_category
    data_type: VARCHAR
    required: true
    is_category_column: true
    is_group_column: false
    permissible_values:
      - sent
      - completed
      - resulted
      - canceled

required_columns:
  - hospitalization_id
  - order_dttm
  - order_category
  - order_status_category

category_columns:
  - order_category
  - order_status_category

group_columns: []
