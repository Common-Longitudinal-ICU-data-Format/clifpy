# CLIF 2.1 -> 3.0 value crosswalk for standardized columns (*_category/*_group/*_type).
#
# This file holds ONLY the value changes that the deterministic normalizer
# (clifpy.utils.crosswalk.normalize_category_value: lowercase + snake_case,
# & -> _and_, / -> _or_) CANNOT reproduce. Everything else (the large majority,
# e.g. IMV -> imv, Non-Hispanic -> non_hispanic, l&d -> l_and_d, DNR/DNI ->
# dnr_or_dni, Mobility/Activity -> mobility_or_activity) is handled by the
# normalizer and intentionally NOT listed here.
#
# Scope: the 16 CLIF beta tables. Completeness is enforced by
# tests/test_crosswalk.py — every 2.1 permissible value must resolve to a valid
# 3.0 permissible value via the normalizer or this file, or be listed under
# `unresolved`.
from_version: "2.1"
to_version: "3.0"

# Non-derivable old -> new value renames (abbreviations, semantic renames,
# spelling corrections, genus reclassifications).
renames:
  patient:
    language_category:
      "Unknown or NA": unknown            # "or NA" dropped

  hospitalization:
    discharge_category:
      "Skilled Nursing Facility (SNF)": snf
      "Acute Inpatient Rehab Facility": acute_ip_rehab
      "Long Term Care Hospital (LTACH)": ltach
      "Acute Care Hospital": acute_care_hosp
      "Against Medical Advice (AMA)": ama
      "Psychiatric Hospital": mental_health_hosp   # semantic rename

  labs:
    lab_category:
      glucose_fingerstick: glucose        # 3.0 folds fingerstick/POC glucose into `glucose`
      glucose_serum: glucose              # 3.0 folds serum glucose into `glucose`
    lab_specimen_category:
      "blood/plasma/serum": plasma_blood

  respiratory_support:
    device_category:
      "High Flow NC": hfnc                # abbreviation
    mode_category:
      "Assist Control-Volume Control": acvc
      "Pressure-Regulated Volume Control": prvc
      "Pressure Support/CPAP": ps_or_cpap

  microbiology_culture:
    organism_category:
      clostridium_difficile: clostridioides_difficile   # genus reclassification
      staphyloccocus_coagneg: staphylococcus_coagneg    # 2.1 spelling typo corrected
      corynebacterium_diptheriae: corynebacterium_non_diphtheriae   # upstream mCIDE rename
      lelliottia_amigena: lelliottia_amnigena                       # spelling corrected
      peptoniphilus_assacharolyticus: peptoniphilus_asaccharolyticus  # spelling corrected
    organism_group:
      branhamelia_moraxella_catarrhalis: branhamella_moraxella_catarrhalis  # spelling corrected
      echinoco_ocalcyst: echinococcal_cyst                                  # spelling corrected
      propionbacterium: propionibacterium                                   # spelling corrected
      torulopsis_galbrata: torulopsis_glabrata                              # spelling corrected
    fluid_category:
      gallbladder_billary_pancreas: gallbladder_biliary_pancreas            # spelling corrected

  microbiology_nonculture:
    fluid_category:
      gallbladder_billary_pancreas: gallbladder_biliary_pancreas            # spelling corrected

  medication_admin_continuous:
    med_category:
      angiotensin: angiotensin_ii
      pitocin: oxytocin                   # brand name -> generic
      insulin: insulin_regular            # the only insulin in the 3.0 continuous CDE
    med_group:
      vasoactives: vasoactive
      diuretics: diuretic
      paralytics: paralytic
      others: other
      "pulmonary vasodilators (IV)": pulmonary_vasodilator        # route no longer encoded in the group
      "pulmonary vasodilators (inhaled)": pulmonary_vasodilator
      Inhaled: respiratory

  medication_admin_intermittent:
    med_category:
      isavuconazonium: isavuconazole      # prodrug folded into the active drug
    med_group:
      anxiolytic: sedation
      paralytics: paralytic
      vasopressor: vasoactive

# Values that cannot be auto-resolved: 1->many splits and values removed in 3.0
# with no direct equivalent. The converter LEAVES THESE UNCHANGED and surfaces
# them in the report (report["columns"][col]["ambiguous"]). Excluded from the
# completeness check.
unresolved:
  medication_admin_continuous:
    med_category:
      albumin:
        candidates: [albumin_5, albumin_25]
        reason: "Concentration-dependent split in 3.0; choose albumin_5 or albumin_25 from the product concentration."
      sodium_bicarbonate:
        candidates: [sodium_bicarbonate_150_meq, sodium_bicarbonate_other]
        reason: "Formulation-dependent split in 3.0; choose from the product concentration."
      sodium_chloride:
        candidates: [sodium_chloride_0_45_pct, sodium_chloride_0_9_pct, sodium_chloride_2_pct, sodium_chloride_3_pct, sodium_chloride_5_pct, sodium_chloride_7_pct, sodium_chloride_20_pct, sodium_chloride_23_4_pct, sodium_chloride_other]
        reason: "Concentration-dependent split in 3.0; choose from the product concentration."
    med_group:
      cardiac:
        candidates: [antiarrhythmic, antihypertensive, other]
        reason: "Split in 3.0; derive from med_category via med_category_to_group_mapping."
  medication_admin_intermittent:
    med_category:
      oxycodone:
        candidates: [oxycodone_ir, oxycodone_er]
        reason: "Split by release form in 3.0; choose immediate- or extended-release from the product."
      micafungin_posaconazole_voriconazole:
        candidates: [micafungin, posaconazole, voriconazole]
        reason: "Pooled antifungal category split into individual drugs in 3.0."
  respiratory_support:
    mode_category:
      "Blow by":
        candidates: []
        reason: "blow_by is a device_category, not a mode_category, in CLIF 3.0; requires a column move, not a value rename."
  labs:
    lab_specimen_category:
      csf:
        candidates: []
        reason: "Removed from lab_specimen_category in CLIF 3.0; no direct equivalent."
      other:
        candidates: []
        reason: "Removed from lab_specimen_category in CLIF 3.0; no direct equivalent."
